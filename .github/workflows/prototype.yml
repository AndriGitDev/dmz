name: Prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  agent-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/agentgateway ./internal/companion/... ./cmd/dmz
      - run: go vet ./internal/agentgateway ./internal/companion/... ./cmd/dmz
      - run: go test ./internal/agentgateway -run '^$' -fuzz FuzzTransform -fuzztime 10s -parallel 4
      - run: go test ./internal/companion/routing -run '^$' -fuzz FuzzCodexRoutingText -fuzztime 10s -parallel 4
      - run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dmz" ./cmd/dmz
      - name: Compile desktop host targets without claiming native qualification
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dmz-darwin-arm64" ./cmd/dmz
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dmz-windows-amd64.exe" ./cmd/dmz
  companion-macos:
    name: Companion macOS native helpers (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile menu-bar host for both Mac CPUs
        run: scripts/build-macos-menubar.sh "$RUNNER_TEMP/dmz-menubar-compile"
      - run: go test -race ./internal/agentgateway ./internal/companion/... ./cmd/dmz ./scripts/companion-package
      - run: go vet ./internal/agentgateway ./internal/companion/... ./cmd/dmz ./scripts/companion-package
      - name: Build private archives and execute the universal binary on the native CPU
        run: GO_BIN=go scripts/package-companion.sh "$RUNNER_TEMP/dmz-companion-packages"
      - name: Compile native menu-bar prototype and verify CLI passthrough
        run: |
          scripts/build-macos-menubar.sh "$RUNNER_TEMP/dmz-menubar" "$RUNNER_TEMP/dmz-companion-packages/stage/DMZ-private-prototype-macos-universal/DMZ.app/Contents/MacOS/dmz-core"
          "$RUNNER_TEMP/dmz-menubar/DMZ.app/Contents/MacOS/DMZ" version
          "$RUNNER_TEMP/dmz-menubar/DMZ.app/Contents/MacOS/DMZ" help >/dev/null
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-naming.py
      - run: go test ./...
      - run: ./scripts/check-lexicon.sh
      - run: ./scripts/check-phone-metadata.sh
      - run: python3 tools/vendor-secrets/generate.py --check
      - run: python3 -m unittest discover -s bench/datasets -p 'test_*.py'
      - run: python3 -m pip install -r bench/contextual/requirements.txt
      - run: python3 -m unittest discover -s bench/contextual -p 'test_*.py'
      - run: python3 -m pip install -r bench/holdout/requirements.txt
      - run: python3 -m unittest discover -s bench/holdout -p 'test_*.py'
      - run: sha256sum --check bench/gates/legal-financial-v1.sha256
      - run: sha256sum --check bench/gates/corpus.sha256
      - run: ./scripts/check-detector-v2.sh
      - run: ./scripts/check-private-key.sh
      - run: ./scripts/check-database-url.sh
      - run: ./scripts/check-bearer.sh
      - run: ./scripts/check-github-token.sh
      - run: ./scripts/check-credential-context.sh
      - run: ./scripts/check-credential-expression.sh
      - run: ./scripts/check-email-shape.sh
      - run: ./scripts/check-email-context.sh
      - run: ./scripts/check-aws-credentials.sh
      - run: ./scripts/check-presigned-url.sh
      - run: ./scripts/check-long-context.sh
      - run: ./scripts/check-quoted-credential.sh
      - run: go run ./bench/scorers -baseline bench/results/v0.json -floor bench/gates/selected-v0-recall.json > /tmp/dmz-benchmark-current.json
      - run: diff -u bench/results/v0.json /tmp/dmz-benchmark-current.json
      - run: go run ./bench/scorers -detector regex > /tmp/dmz-regex-current.json
      - run: diff -u bench/results/regex-v0.json /tmp/dmz-regex-current.json
      - run: go run ./bench/scorers -mode exposure -max-exposed 0 > /tmp/dmz-exposure-current.json
      - run: diff -u bench/results/exposure-v0.json /tmp/dmz-exposure-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/challenge-v0.jsonl -floor bench/gates/challenge-v0-recall.json > /tmp/dmz-challenge-current.json
      - run: diff -u bench/results/challenge-v0.json /tmp/dmz-challenge-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/challenge-v0.jsonl -mode exposure -max-exposed 2 > /tmp/dmz-challenge-exposure-current.json
      - run: diff -u bench/results/challenge-exposure-v0.json /tmp/dmz-challenge-exposure-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/exploratory-v1.jsonl -floor bench/gates/exploratory-v1-recall.json > /tmp/dmz-exploratory-current.json
      - run: diff -u bench/results/exploratory-v1.json /tmp/dmz-exploratory-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/exploratory-v1.jsonl -mode exposure -max-exposed 13 > /tmp/dmz-exploratory-exposure-current.json
      - run: diff -u bench/results/exploratory-exposure-v1.json /tmp/dmz-exploratory-exposure-current.json
  presidio-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r bench/baselines/requirements.txt
      - run: python bench/baselines/presidio.py > /tmp/dmz-presidio-current.json
      - run: diff -u bench/results/presidio-v0.json /tmp/dmz-presidio-current.json
  dmz-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/dmz/package-lock.json
      - run: npm ci
        working-directory: apps/dmz
      - run: npm run check
        working-directory: apps/dmz
      - run: node scripts/scanner-unit.mjs
        working-directory: apps/dmz
      - run: node scripts/scanner-lifecycle-unit.mjs
        working-directory: apps/dmz
      - run: node bench/holdout/editor/test-core.cjs
      - run: npm run test:coverage
        working-directory: apps/dmz
      - name: Install verified TinyGo 0.42.0
        run: |
          curl --fail --location --retry 3 --output /tmp/tinygo.tar.gz https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo0.42.0.linux-amd64.tar.gz
          echo 'b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438  /tmp/tinygo.tar.gz' | sha256sum --check
          tar -xzf /tmp/tinygo.tar.gz -C /tmp
      - run: GO_BIN=go TINYGO_BIN=/tmp/tinygo/bin/tinygo ./scripts/build-wasm.sh
      - run: npm run build
        working-directory: apps/dmz
      - run: node scripts/wasm-smoke.mjs
        timeout-minutes: 2
        working-directory: apps/dmz
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dmz
      - name: Check local companion onboarding in Chromium with synthetic tool discovery
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/DMZ" ./cmd/dmz
          node scripts/agent-companion-ui-smoke.mjs --dmz "$RUNNER_TEMP/DMZ" --playwright "$GITHUB_WORKSPACE/apps/dmz/node_modules/playwright"
      - run: node bench/holdout/editor/test-browser.mjs
      - run: npm run test:browser
        working-directory: apps/dmz
      - run: npm run test:pause
        working-directory: apps/dmz
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/dmz
      - run: npm run record:build
        working-directory: apps/dmz
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: dmz-chromium-prototype
          path: apps/dmz/.output/chrome-mv3
          if-no-files-found: error
          retention-days: 14

  companion-macos-review-download:
    name: Unsigned native Mac review download
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 27 && github.event.pull_request.head.repo.full_name == github.repository
    needs: [agent-gateway, core, presidio-baseline, dmz-browser, companion-macos]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify the exact source used for the review binary
        run: go test -race ./internal/agentgateway ./internal/companion/... ./cmd/dmz
      - name: Build the reviewed unsigned menu-bar bundle
        run: GO_BIN=go scripts/package-companion.sh "$RUNNER_TEMP/dmz-native-review-download"
      - name: Keep the review checksum specific to the Mac download
        run: |
          python3 - "$RUNNER_TEMP/dmz-native-review-download" <<'PYMACSUM'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          name = 'DMZ-private-prototype-macos-universal.zip'
          lines = (root / 'SHA256SUMS.txt').read_text().splitlines()
          selected = [line for line in lines if line.split()[-1] == name]
          assert len(selected) == 1
          (root / 'MAC-SHA256SUMS.txt').write_text(selected[0] + '\n')
          PYMACSUM
      - uses: actions/upload-artifact@v6
        with:
          name: dmz-native-macos-review-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dmz-native-review-download/DMZ-private-prototype-macos-universal.zip
            ${{ runner.temp }}/dmz-native-review-download/MAC-SHA256SUMS.txt
            ${{ runner.temp }}/dmz-native-review-download/validation.txt
            ${{ runner.temp }}/dmz-native-review-download/stage/DMZ-private-prototype-macos-universal/MANIFEST.txt
