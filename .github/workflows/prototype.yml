name: Prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./scripts/check-lexicon.sh
      - run: python3 -m unittest discover -s bench/datasets -p 'test_*.py'
      - run: python3 -m pip install -r bench/contextual/requirements.txt
      - run: python3 -m unittest discover -s bench/contextual -p 'test_*.py'
      - run: python3 -m pip install -r bench/holdout/requirements.txt
      - run: python3 -m unittest discover -s bench/holdout -p 'test_*.py'
      - run: sha256sum --check bench/gates/legal-financial-v1.sha256
      - run: sha256sum --check bench/gates/corpus.sha256
      - run: ./scripts/check-detector-v2.sh
      - run: ./scripts/check-private-key.sh
      - run: ./scripts/check-database-url.sh
      - run: ./scripts/check-bearer.sh
      - run: ./scripts/check-github-token.sh
      - run: ./scripts/check-credential-context.sh
      - run: ./scripts/check-credential-expression.sh
      - run: ./scripts/check-email-shape.sh
      - run: ./scripts/check-email-context.sh
      - run: ./scripts/check-aws-credentials.sh
      - run: ./scripts/check-presigned-url.sh
      - run: ./scripts/check-long-context.sh
      - run: go run ./bench/scorers -baseline bench/results/v0.json -floor bench/gates/selected-v0-recall.json > /tmp/dmz-benchmark-current.json
      - run: diff -u bench/results/v0.json /tmp/dmz-benchmark-current.json
      - run: go run ./bench/scorers -detector regex > /tmp/dmz-regex-current.json
      - run: diff -u bench/results/regex-v0.json /tmp/dmz-regex-current.json
      - run: go run ./bench/scorers -mode exposure -max-exposed 0 > /tmp/dmz-exposure-current.json
      - run: diff -u bench/results/exposure-v0.json /tmp/dmz-exposure-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/challenge-v0.jsonl -floor bench/gates/challenge-v0-recall.json > /tmp/dmz-challenge-current.json
      - run: diff -u bench/results/challenge-v0.json /tmp/dmz-challenge-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/challenge-v0.jsonl -mode exposure -max-exposed 2 > /tmp/dmz-challenge-exposure-current.json
      - run: diff -u bench/results/challenge-exposure-v0.json /tmp/dmz-challenge-exposure-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/exploratory-v1.jsonl -floor bench/gates/exploratory-v1-recall.json > /tmp/dmz-exploratory-current.json
      - run: diff -u bench/results/exploratory-v1.json /tmp/dmz-exploratory-current.json
      - run: go run ./bench/scorers -corpus bench/corpus/exploratory-v1.jsonl -mode exposure -max-exposed 13 > /tmp/dmz-exploratory-exposure-current.json
      - run: diff -u bench/results/exploratory-exposure-v1.json /tmp/dmz-exploratory-exposure-current.json
  presidio-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r bench/baselines/requirements.txt
      - run: python bench/baselines/presidio.py > /tmp/dmz-presidio-current.json
      - run: diff -u bench/results/presidio-v0.json /tmp/dmz-presidio-current.json
  shield-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shield/package-lock.json
      - run: npm ci
        working-directory: apps/shield
      - run: npm run check
        working-directory: apps/shield
      - run: node scripts/scanner-unit.mjs
        working-directory: apps/shield
      - run: node scripts/scanner-lifecycle-unit.mjs
        working-directory: apps/shield
      - run: node bench/holdout/editor/test-core.cjs
      - run: npm run test:coverage
        working-directory: apps/shield
      - name: Install verified TinyGo 0.42.0
        run: |
          curl --fail --location --retry 3 --output /tmp/tinygo.tar.gz https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo0.42.0.linux-amd64.tar.gz
          echo 'b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438  /tmp/tinygo.tar.gz' | sha256sum --check
          tar -xzf /tmp/tinygo.tar.gz -C /tmp
      - run: GO_BIN=go TINYGO_BIN=/tmp/tinygo/bin/tinygo ./scripts/build-wasm.sh
      - run: npm run build
        working-directory: apps/shield
      - run: node scripts/wasm-smoke.mjs
        working-directory: apps/shield
      - run: npx playwright install --with-deps chromium
        working-directory: apps/shield
      - run: node bench/holdout/editor/test-browser.mjs
      - run: npm run test:browser
        working-directory: apps/shield
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/shield
      - run: npm run record:build
        working-directory: apps/shield
      - uses: actions/upload-artifact@v6
        with:
          name: shield-chromium-prototype
          path: apps/shield/.output/chrome-mv3
          if-no-files-found: error
          retention-days: 14
